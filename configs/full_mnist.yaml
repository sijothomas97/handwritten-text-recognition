# Full MNIST training run (CPU-feasible, ~10 epochs).
data:
  dataset: mnist
  root: data
  image_size: 28
  batch_size: 128
  num_workers: 0
  train_subset: null
  test_subset: null

model:
  arch: resnet18
  image_channels: 1

train:
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  device: cpu
  out_dir: models
  run_name: mnist-resnet18
