[project]
name = "htr"
version = "0.1.0"
description = "Sequence OCR: CRNN + CTC word recognition trained on synthetic rendered words"
requires-python = ">=3.12"
dependencies = [
    "torch==2.7.1",
    "numpy==2.3.1",
    "pillow==11.2.1",
    "onnx==1.18.0",
    "onnxruntime==1.22.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["htr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
